<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blackjack Cheat Sheet</title>
<style>
:root {
  --lime-dark: #859c2e;
  --ink: #1a1a1a;
  --muted: #5b6270;
  --line: #e3e6ea;
  --band: #f9fafa;
  --shadow-shell: 0 -1px 20px 2px rgba(0, 0, 0, 0.1);
  --hit: #f4c7c3; --stand: #fff2a8; --double: #b7e1cd; --split: #c9daf8; --surrender: #d9c3e9;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; padding: 24px 12px 40px;
  background: #eef0f2; color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  line-height: 1.4; overflow-x: hidden;
}
.shell {
  max-width: 852px; margin: 0 auto; background: #fff;
  border: 0; border-radius: 16px; box-shadow: var(--shadow-shell); overflow: hidden;
}
.shell-header { background: var(--band); padding: 24px 20px 20px; }
.shell-header h1 {
  margin: 0; text-align: center; text-transform: uppercase; font-weight: 700;
  color: var(--lime-dark); font-size: 20px; line-height: 1.2; letter-spacing: 0.02em;
}
.shell-body { padding: 24px; }
.rules-note { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
.rules-note strong { color: var(--ink); }

.rule-panel { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; margin: 0 0 20px; }
.rule-field { margin: 0; padding: 0; border: 0; min-width: 0; }
.rule-field legend { padding: 0; margin: 0 0 6px; font-size: 13px; font-weight: 700; color: var(--ink); }
.toggle-row { display: flex; flex-wrap: wrap; border-radius: 6px; overflow: hidden; border: 1px solid rgba(0, 0, 0, 0.12); background: #fff; }
.toggle-opt { position: relative; flex: 1 1 0; min-width: 72px; display: flex; cursor: pointer; }
.toggle-opt input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.toggle-opt span {
  flex: 1; display: flex; align-items: center; justify-content: center; text-align: center;
  min-height: 44px; padding: 6px 8px; font-size: 13px; font-weight: 500; color: #5e6166; background: #fff;
}
.toggle-opt + .toggle-opt span { border-left: 1px solid rgba(0, 0, 0, 0.12); }
.toggle-opt input:checked + span { background: #c4db11; color: #404040; font-weight: 700; }
.toggle-opt input:focus-visible + span { outline: 3px solid #404040; outline-offset: -3px; }

.legend { display: flex; flex-wrap: wrap; gap: 8px 10px; margin: 0 0 24px; padding: 0; list-style: none; }
.legend li {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 6px;
  border-radius: 999px; font-size: 13px; font-weight: 600;
}

.chart-section { margin: 0 0 28px; }
.chart-section:last-child { margin-bottom: 0; }
.chart-section h2 { margin: 0 0 4px; font-size: 18px; font-weight: 700; }
.chart-section .sub { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 10px; }
table.chart { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 720px; table-layout: fixed; }
.chart th, .chart td { padding: 0; text-align: center; border-right: 1px solid #fff; border-bottom: 1px solid #fff; }
.chart thead th {
  background: var(--band); font-size: 13px; font-weight: 700; padding: 8px 2px;
  border-bottom: 1px solid var(--line);
}
.chart .corner { width: 84px; text-align: left; padding-left: 10px; font-size: 12px; color: var(--muted); }
.chart tbody th {
  position: sticky; left: 0; z-index: 1; width: 84px; background: var(--band);
  font-size: 14px; font-weight: 700; text-align: left; padding: 0 10px; border-right: 1px solid var(--line);
}
.chart thead .corner { position: sticky; left: 0; z-index: 2; border-right: 1px solid var(--line); }
.chart td { height: 52px; font-size: 12px; font-weight: 600; color: var(--ink); vertical-align: middle; }
.chart td .cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.mi {
  display: inline-block; width: 20px; height: 20px; flex: none;
  background-repeat: no-repeat; background-position: center; background-size: contain;
}
.m-hit { background-color: var(--hit); }
.m-stand { background-color: var(--stand); }
.m-double { background-color: var(--double); }
.m-split { background-color: var(--split); }
.m-surrender { background-color: var(--surrender); }

@media (max-width: 600px) {
  body { padding: 12px 12px 32px; }
  .shell-header h1 { font-size: 18px; }
  .shell-body { padding: 16px; }
  .chart td { height: 54px; }
  .rule-panel { grid-template-columns: minmax(0, 1fr); }
}
</style>
<style>
/*@@ICON_CSS@@*/
</style>
</head>
<body>
<main class="shell">
  <header class="shell-header"><h1>Blackjack Cheat Sheet</h1></header>
  <div class="shell-body">
    <div class="rule-panel" id="rule-panel"></div>
    <p class="rules-note" aria-live="polite"><strong>Table rules:</strong> <span id="rules-text"></span></p>
    <ul class="legend" id="legend" aria-label="Key to moves"></ul>
    <div id="chart"></div>
  </div>
</main>
<!--@@ENGINE_SCRIPTS@@-->
<script data-app="chipy-cheat-sheet">
(function (root) {
  'use strict';

  var DEFAULT_RULES = { decks: '4-8', soft17: 'hits', das: 'yes', surrender: 'any' };

  // Display only: engine move name -> word, CSS class suffix. Moves themselves come from chart.js.
  var MOVE_UI = {
    HIT: { word: 'Hit', id: 'hit' },
    STAND: { word: 'Stand', id: 'stand' },
    DOUBLE: { word: 'Double', id: 'double' },
    SPLIT: { word: 'Split', id: 'split' },
    SURRENDER: { word: 'Surrender', id: 'surrender' }
  };
  var MOVE_ORDER = ['HIT', 'STAND', 'DOUBLE', 'SPLIT', 'SURRENDER'];
  var TABLES = [
    { key: 'hard', heading: 'Hard hands', sub: 'No Ace, or an Ace that counts as 1.' },
    { key: 'soft', heading: 'Soft hands', sub: 'An Ace that counts as 11, plus one other card.' },
    { key: 'pairs', heading: 'Pairs', sub: 'Two cards of the same value.' }
  ];

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // Engine soft labels 13..20 are shown as A,2 .. A,9 (D-049, display only).
  function displayRowLabel(table, label) {
    if (table === 'soft') {
      var n = parseInt(label, 10);
      if (n >= 13 && n <= 20) return 'A,' + (n - 11);
    }
    return label;
  }

  function cellHTML(cell) {
    var ui = MOVE_UI[cell.move];
    if (!ui) throw new Error('unknown move: ' + cell.move);
    return '<td class="m-' + ui.id + '" data-move="' + cell.move + '"><span class="cell">' +
      '<span class="mi mi-' + ui.id + '" aria-hidden="true"></span>' +
      '<span class="mw">' + ui.word + '</span></span></td>';
  }

  function tableHTML(def, chart) {
    var rows = chart[def.key];
    var out = '<section class="chart-section" id="chart-' + def.key + '">' +
      '<h2>' + esc(def.heading) + '</h2><p class="sub">' + esc(def.sub) + '</p>' +
      '<div class="scroll" tabindex="0" role="region" aria-label="' + esc(def.heading) + ' chart, scrolls sideways">' +
      '<table class="chart" data-table="' + def.key + '"><thead><tr><th class="corner" scope="col">Your hand</th>';
    chart.columns.forEach(function (c) { out += '<th scope="col" data-dealer="' + esc(c) + '">' + esc(c) + '</th>'; });
    out += '</tr></thead><tbody>';
    rows.forEach(function (r) {
      out += '<tr data-row="' + esc(r.label) + '"><th scope="row">' + esc(displayRowLabel(def.key, r.label)) + '</th>';
      r.cells.forEach(function (c) { out += cellHTML(c); });
      out += '</tr>';
    });
    return out + '</tbody></table></div></section>';
  }

  function renderChartHTML(chart) {
    return TABLES.map(function (def) { return tableHTML(def, chart); }).join('');
  }

  function renderLegendHTML() {
    return MOVE_ORDER.map(function (m) {
      var ui = MOVE_UI[m];
      return '<li class="m-' + ui.id + '"><span class="mi mi-' + ui.id + '" aria-hidden="true"></span>' + ui.word + '</li>';
    }).join('');
  }

  // Rules sentence words (D-039). One map; the tests compare the result to snapshot `label` for all 36.
  var LABEL_WORDS = {
    decks: { '1': '1 deck', '2': '2 decks', '4-8': '4\u20138 decks' },
    soft17: { stands: 'Dealer stands on soft 17', hits: 'Dealer hits on soft 17' },
    das: { yes: 'Double after split allowed', no: 'No double after split' },
    surrender: { none: 'No surrender', any: 'Surrender: any dealer card', except_ace: 'Surrender: any dealer card except ace' }
  };
  // Control definitions: field, group label, [value, button text] (D-002, D-045). Double down is not a control.
  var CONTROLS = [
    { field: 'decks', label: 'Decks', options: [['1', '1'], ['2', '2'], ['4-8', '4\u20138']] },
    { field: 'soft17', label: 'Dealer on soft 17', options: [['stands', 'Stands'], ['hits', 'Hits']] },
    { field: 'das', label: 'Double after split', options: [['yes', 'Yes'], ['no', 'No']] },
    { field: 'surrender', label: 'Surrender', options: [['none', 'Not allowed'], ['any', 'Any dealer card'], ['except_ace', 'Except ace']] }
  ];
  var FIELDS = CONTROLS.map(function (c) { return c.field; });
  var SEP = ' \u00b7 ';

  var state = { rules: copyRules(DEFAULT_RULES) };
  var listeners = [];
  var dom = null; // set by init() only
  var inited = false;

  function copyRules(r) {
    return { decks: r.decks, soft17: r.soft17, das: r.das, surrender: r.surrender };
  }

  function has(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }

  // Returns a clean rules object, or null when anything is missing or unknown (D-023).
  function validRules(r) {
    if (!r || typeof r !== 'object' || Array.isArray(r)) return null;
    var out = {};
    for (var i = 0; i < FIELDS.length; i++) {
      var f = FIELDS[i], v = has(r, f) ? r[f] : undefined;
      if (typeof v !== 'string' || !has(LABEL_WORDS[f], v)) return null;
      out[f] = v;
    }
    return out;
  }

  function rulesSentence(rules) {
    return FIELDS.map(function (f) { return LABEL_WORDS[f][rules[f]]; }).join(SEP);
  }

  // Pure: control values { decks, soft17, das, surrender } -> rules, or null if incomplete/invalid.
  function rulesFromControls(values) { return validRules(values); }

  function controlsHTML() {
    return CONTROLS.map(function (c) {
      var out = '<fieldset class="rule-field" data-field="' + c.field + '"><legend>' + esc(c.label) + '</legend><div class="toggle-row">';
      c.options.forEach(function (o) {
        out += '<label class="toggle-opt"><input type="radio" name="rule-' + c.field + '" value="' + esc(o[0]) + '">' +
          '<span>' + esc(o[1]) + '</span></label>';
      });
      return out + '</div></fieldset>';
    }).join('');
  }

  function render() {
    if (!dom) return;
    var rules = state.rules;
    dom.chart.innerHTML = renderChartHTML(root.ChipyEngine.chart.buildChart(rules));
    dom.text.textContent = rulesSentence(rules);
    var radios = dom.panel.querySelectorAll('input[type="radio"]');
    for (var i = 0; i < radios.length; i++) {
      var f = radios[i].name.replace(/^rule-/, '');
      radios[i].checked = rules[f] === radios[i].value;
    }
  }

  // Returns true when applied. Invalid input changes nothing and fires nothing.
  function setRules(rules) {
    var next = validRules(rules);
    if (!next) return false;
    var changed = FIELDS.some(function (f) { return state.rules[f] !== next[f]; });
    state.rules = next;
    render();
    if (!changed) return true;
    var snapshot = copyRules(next);
    listeners.slice().forEach(function (fn) { fn(copyRules(snapshot)); });
    return true;
  }

  function getRules() { return copyRules(state.rules); }

  // Fires once per valid setRules call with the new rules. Returns an unsubscribe function.
  function onRulesChange(fn) {
    if (typeof fn !== 'function') throw new Error('onRulesChange needs a function');
    listeners.push(fn);
    return function () { var i = listeners.indexOf(fn); if (i >= 0) listeners.splice(i, 1); };
  }

  function onControlChange(ev) {
    var t = ev && ev.target;
    if (!t || t.type !== 'radio' || typeof t.name !== 'string') return;
    var f = t.name.replace(/^rule-/, '');
    if (FIELDS.indexOf(f) < 0) return;
    var values = copyRules(state.rules);
    values[f] = t.value;
    if (!setRules(rulesFromControls(values))) render(); // put the controls back on the active rules
  }

  function init() {
    if (inited) return;
    inited = true;
    dom = {
      panel: document.getElementById('rule-panel'),
      text: document.getElementById('rules-text'),
      chart: document.getElementById('chart')
    };
    document.getElementById('legend').innerHTML = renderLegendHTML();
    dom.panel.innerHTML = controlsHTML();
    dom.panel.addEventListener('change', onControlChange);
    render();
  }

  function buildChart(rules) { return root.ChipyEngine.chart.buildChart(rules); }

  root.ChipyCheatSheet = {
    DEFAULT_RULES: DEFAULT_RULES,
    buildChart: buildChart,
    displayRowLabel: displayRowLabel,
    renderChartHTML: renderChartHTML,
    renderLegendHTML: renderLegendHTML,
    rulesSentence: rulesSentence,
    rulesFromControls: rulesFromControls,
    getRules: getRules,
    setRules: setRules,
    onRulesChange: onRulesChange,
    init: init
  };

  if (typeof document !== 'undefined') init();
})(typeof window !== 'undefined' ? window : globalThis);
</script>
</body>
</html>
