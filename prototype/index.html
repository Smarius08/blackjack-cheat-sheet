<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blackjack Cheat Sheet</title>
<style>
:root {
  --ink: #1a1a1a;
  --heading: #404040;
  --body: #5e6166;
  --muted: #5e6166;
  --line: #e6e6e6;
  --band: #f9fafa;
  --lime: #c4db11;
  --lime-dark: #859c2e;
  --shadow-shell: 0 -1px 20px 2px rgba(0, 0, 0, 0.1);
  --hit: #ffffff; --stand: #bfbfbf; --double: #c4db11; --split: #859c2e; --surrender: #404040;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; padding: 40px 8px 40px;
  background: #fff; color: var(--ink);
  font-family: Roboto, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  line-height: normal; overflow-x: hidden;
}
.shell {
  max-width: 852px; margin: 0 auto; background: #fff;
  border: 0; border-radius: 16px; box-shadow: var(--shadow-shell); overflow: hidden;
}
.shell-header { background: var(--band); padding: 24px 20px 20px; }
.shell-header h1 {
  margin: 0; text-align: center; text-transform: uppercase; font-weight: 700;
  color: var(--heading); font-size: 20px; line-height: normal; letter-spacing: 0.02em;
}
.shell-body { padding: 24px; }
.rules-note { margin: 0 0 20px; color: var(--body); font-size: 14px; line-height: 1.4; }
.rules-note strong { color: var(--heading); font-weight: 700; }

/* Segmented controls: mode switch and rule toggles (library style) */
.rule-panel { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; margin: 0 0 20px; }
.rule-field { margin: 0; padding: 0; border: 0; min-width: 0; }
.rule-field legend { padding: 0; margin: 0 0 8px; font-size: 16px; font-weight: 500; color: var(--heading); }
.toggle-row, .mode-switch { display: flex; height: 48px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--band); }
.toggle-opt { position: relative; flex: 1 1 0; min-width: 0; display: flex; cursor: pointer; }
.toggle-opt input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.toggle-opt span, .mode-btn {
  flex: 1; display: flex; align-items: center; justify-content: center; text-align: center;
  padding: 12px 16px; font-size: 14px; font-weight: 400; line-height: 1.15; color: var(--body); background: var(--band);
}
.toggle-row:has(.toggle-opt:nth-child(3)) .toggle-opt span { padding: 0 8px; }
.toggle-opt input:checked + span { background: var(--lime); color: var(--heading); }
.toggle-row:has(.toggle-opt:nth-child(3)) .toggle-opt input:checked + span { font-weight: 700; }
.toggle-opt input:focus-visible + span { outline: 3px solid #404040; outline-offset: -3px; }

.legend { display: flex; flex-wrap: wrap; gap: 8px 10px; margin: 0 0 24px; padding: 0; list-style: none; }
.legend li {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 5px 10px 5px 6px;
  border-radius: 999px; font-size: 13px; font-weight: 600;
}
.legend li.m-hit { border: 1px solid var(--line); padding: 4px 9px 4px 5px; }

/* Chart */
.chart-section { margin: 0 0 28px; }
.chart-section:last-child { margin-bottom: 0; }
.chart-section h2 { margin: 0 0 4px; font-size: 18px; font-weight: 700; color: var(--heading); }
.chart-section .sub { margin: 0 0 14px; font-size: 13px; color: var(--body); }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 12px; scroll-padding-left: 84px; scroll-padding-right: 8px; }
table.chart { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 704px; table-layout: fixed; }
.chart th, .chart td { padding: 0; text-align: center; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.chart tr > :last-child { border-right: 0; }
.chart tbody tr:last-child > * { border-bottom: 0; }
.chart thead th {
  background: var(--band); height: 36px; font-size: 13px; font-weight: 700; color: var(--heading); padding: 0 2px;
}
.chart .corner { width: 84px; text-align: left; padding-left: 10px; font-size: 12px; font-weight: 500; color: var(--body); }
.chart tbody th {
  position: sticky; left: 0; z-index: 2; width: 84px; background: var(--band); color: var(--heading);
  font-size: 14px; font-weight: 700; text-align: left; padding: 0 10px;
}
.chart thead .corner { position: sticky; left: 0; z-index: 3; }
.chart td { height: 52px; padding: 0 2px; font-size: 12px; font-weight: 600; vertical-align: middle; }
.chart td .cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.mi {
  display: inline-block; width: 20px; height: 20px; flex: none; background-color: currentColor;
  -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center;
  -webkit-mask-size: contain; mask-size: contain;
}
.chart td { position: relative; }
.cell-hit {
  position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; border: 0; border-radius: 0;
  background: transparent; cursor: pointer; font: inherit; -webkit-tap-highlight-color: transparent;
}
.cell-hit:focus-visible { outline: 3px solid #404040; outline-offset: -3px; }
.cell-hit.is-open { box-shadow: inset 0 0 0 3px #404040; }
.m-surrender .cell-hit:focus-visible { outline-color: #fff; }
.m-surrender .cell-hit.is-open { box-shadow: inset 0 0 0 3px #fff; }
/* Changed for your new rules: dashed inner outline + 12px corner triangle; the cell never grows (D-074) */
.cell-hit[data-changed] { outline: 2px dashed #1a1d22; outline-offset: -2px; }
.cell-hit[data-changed]::after {
  content: ""; position: absolute; top: 0; right: 0; width: 12px; height: 12px; background: #1a1d22;
  clip-path: polygon(0 0, 100% 0, 100% 100%); pointer-events: none;
}
.cell-hit[data-changed]:focus-visible { outline: 3px solid #404040; outline-offset: -3px; }
.m-surrender .cell-hit[data-changed] { outline-color: #fff; }
.m-surrender .cell-hit[data-changed]::after { background: #fff; }
.m-surrender .cell-hit[data-changed]:focus-visible { outline: 3px solid #fff; outline-offset: -3px; }

/* Buttons: library secondary */
.print-btn, .rules-toggle, .diff-dismiss, .rp-close {
  font: inherit; cursor: pointer; flex: none; height: 48px; padding: 16px 24px; margin: 0;
  font-size: 14px; font-weight: 700; line-height: 1; text-transform: uppercase; color: var(--body);
  background: transparent; border: 2px solid var(--lime); border-radius: 6px;
  display: inline-flex; align-items: center; justify-content: center;
}
.print-btn:focus-visible, .rules-toggle:focus-visible, .diff-dismiss:focus-visible, .rp-close:focus-visible { outline: 3px solid #404040; outline-offset: 2px; }
.rules-toggle { margin: 0 0 20px; }
.print-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 20px; }
.print-sheet { display: none; }

.diff-note {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 20px; padding: 6px 8px 6px 14px;
  border: 1px solid #1a1a1a; border-radius: 8px; background: #fff; font-size: 14px; font-weight: 600; color: var(--ink);
}
.sa-changed {
  margin: 0 0 12px; padding: 6px 10px; border: 2px dashed #1a1a1a; border-radius: 8px; background: #fff;
  font-size: 14px; font-weight: 700; color: var(--ink);
}
.scroll-wrap { position: relative; }
.swipe-hint { display: none; margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--body); }
.m-hit { background-color: var(--hit); color: #404040; }
.m-stand { background-color: var(--stand); color: #404040; }
.m-double { background-color: var(--double); color: #404040; }
.m-split { background-color: var(--split); color: #1a1d22; }
.m-surrender { background-color: var(--surrender); color: #fff; }

[hidden] { display: none !important; }
.reason-slot { margin: 14px 0 0; }
.rp-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.rp-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 8px 8px 16px; background: rgba(180, 202, 9, 0.15); }
.rp-title { margin: 0; font-size: 16px; font-weight: 700; color: #404040; }
.rp-body { padding: 14px 16px 16px; }
.rp-move { display: inline-flex; align-items: center; gap: 10px; padding: 6px 14px 6px 8px; border-radius: 999px; background: rgba(196, 219, 17, 0.2); border: 1px solid #c4db11; }
.rp-circle { width: 32px; height: 32px; border-radius: 50%; background: rgba(196, 219, 17, 0.6); display: flex; align-items: center; justify-content: center; flex: none; }
.rp-circle { color: #404040; }
.rp-circle .mi { width: 22px; height: 22px; }
.rp-word { font-size: 20px; font-weight: 800; text-transform: uppercase; color: #404040; }
.rp-reason { margin: 12px 0 0; font-size: 16px; line-height: 1.45; color: var(--ink); }
.rp-note { margin: 12px 0 0; font-size: 14px; line-height: 1.4; color: #5e6166; }
.mode-switch { margin: 0 0 20px; }
.mode-btn, .pick {
  font-family: inherit; cursor: pointer; border: 0; margin: 0;
  -webkit-tap-highlight-color: transparent;
}
.mode-btn { flex: 1 1 0; }
.mode-btn[aria-pressed="true"] { background: var(--lime); color: var(--heading); }
.pick[aria-pressed="true"] { background: var(--lime); font-weight: 700; }
.mode-btn:focus-visible, .pick:focus-visible, .sa-link:focus-visible { outline: 3px solid #404040; outline-offset: 2px; position: relative; z-index: 1; }
.mode-btn:focus-visible { outline-offset: -3px; }

.tm-step { scroll-margin-top: 12px; }
.tm-step { margin: 0 0 18px; }
#table-result { scroll-margin-top: 12px; }
.tm-step h2 { margin: 0 0 8px; font-size: 16px; font-weight: 700; color: var(--ink); }
.tm-group { margin: 0 0 12px; }
.tm-group h3 { margin: 0 0 6px; font-size: 13px; font-weight: 700; color: var(--body); }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(59px, 1fr)); gap: 8px; }
.pick {
  min-width: 44px; height: 48px; padding: 4px; font-size: 16px; font-weight: 600; color: #404040; background: #fff;
  border: 1px solid rgba(0, 0, 0, 0.18); border-radius: 8px;
}

.sa-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.sa-header { padding: 12px 16px; background: rgba(180, 202, 9, 0.15); font-size: 16px; font-weight: 500; color: #404040; letter-spacing: 0.01em; }
.sa-body { padding: 16px 20px 20px; }
.sa-empty { margin: 0; font-size: 14px; color: #5e6166; text-align: center; padding: 16px 20px; }
.sa-hand { margin: 0 0 6px; font-size: 40px; font-weight: 900; line-height: 1.05; color: #404040; }
.sa-dealer { display: inline-block; margin: 0 0 14px; padding: 2px 10px; border-radius: 999px; background: #eef0f2; font-size: 13px; font-weight: 700; color: #5e6166; }
.sa-rec-move {
  min-height: 64px; background: rgba(196, 219, 17, 0.2); border: 1px solid #c4db11; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 12px;
}
.sa-circle { width: 40px; height: 40px; border-radius: 50%; background: rgba(196, 219, 17, 0.6); display: flex; align-items: center; justify-content: center; flex: none; }
.sa-circle { color: #404040; }
.sa-circle .mi { width: 26px; height: 26px; }
.sa-rec-word { font-size: 28px; font-weight: 800; text-transform: uppercase; color: #404040; }
.sa-rec-note { margin: 12px 0 0; font-size: 15px; font-weight: 500; color: #5e6166; line-height: 1.35; }
.sa-link-row { margin: 16px 0 0; font-size: 14px; }
.sa-link { color: #5f7220; font-weight: 600; display: inline-flex; align-items: center; min-height: 44px; padding: 10px 0; }

/* ---- Print (S-11, D-054, D-064): full page and pocket card; only the chosen sheet prints ---- */
@page { size: portrait; margin: 10mm; }
@page pocket { size: landscape; margin: 8mm; }
@media print {
  html, body { background: #fff !important; margin: 0; padding: 0; }
  body { overflow: visible; }
  .shell, #rule-panel, #mode-switch, #table-mode, .reason-slot, button { display: none !important; }
  .print-sheet { -webkit-print-color-adjust: exact; print-color-adjust: exact; color: #000; }
  .print-full { display: block; }
  .print-pocket { display: none; }
  html[data-print="pocket"] .print-full { display: none; }
  html[data-print="pocket"] .print-pocket { display: flex; flex-direction: column; justify-content: center; height: 100vh; page: pocket; }

  /* Full page: 190 mm wide; fits Letter's 259 mm of height */
  .pf-title { margin: 0; text-align: center; text-transform: uppercase; font-size: 17pt; font-weight: 700; color: #404040; line-height: 1.2; }
  .pf-rules { margin: 1.5mm 0 2mm; text-align: center; font-size: 9.5pt; font-weight: 600; }
  .pf-legend { display: flex; justify-content: center; gap: 3mm; margin: 0 0 3mm; padding: 0; list-style: none; }
  .pf-legend li { display: inline-flex; align-items: center; gap: 1.5mm; height: 24pt; padding: 0 3mm 0 1.6mm; border: 0.75pt solid transparent; border-radius: 12pt; font-size: 10.4pt; font-weight: 600; }
  .pf-legend li.m-hit { border-color: #e6e6e6; }
  .pf-legend .mi { width: 16pt; height: 16pt; }
  .pf-sec { margin: 0 0 2mm; break-inside: avoid; }
  .pf-sec h2 { margin: 0 0 0.8mm; font-size: 9.5pt; font-weight: 700; color: #404040; }
  table.pf { width: 190mm; border-collapse: separate; border-spacing: 0.75pt; background: #5e6166; padding: 0.75pt; table-layout: fixed; }
  .pf th, .pf td { padding: 0; border: 0; text-align: center; height: 6mm; }
  .pf thead th { background: #f9fafa; color: #404040; font-size: 8pt; font-weight: 700; height: 5mm; }
  .pf th.pf-corner { width: 20mm; font-size: 6.5pt; font-weight: 500; color: #5e6166; text-align: left; padding-left: 1.5mm; }
  .pf tbody th { background: #f9fafa; color: #404040; font-size: 8pt; font-weight: 700; text-align: left; padding-left: 1.5mm; }
  .pf td .pc { display: inline-flex; align-items: center; justify-content: center; gap: 0.8mm; }
  .pf td .mi { width: 9pt; height: 9pt; }
  .pf td .mw { font-size: 6.8pt; font-weight: 600; color: inherit; }

  /* Pocket card: two A6 panels (105 x 148 mm) side by side = 210 x 148 mm, centred on a landscape sheet */
  .pc-sheet { position: relative; width: 210mm; height: 148mm; margin: 4mm auto 0; display: flex; flex: none; }
  .pc-panel { position: relative; width: 105mm; height: 148mm; padding: 5mm 5mm 4mm; overflow: hidden; display: flex; flex-direction: column; }
  .pc-panel + .pc-panel { border-left: 0.3mm dashed #5e6166; }
  .pc-mark { position: absolute; width: 3mm; height: 3mm; border: 0 solid #888; }
  .pc-mark.tl { left: -4.5mm; top: -4.5mm; border-right-width: 0.2mm; border-bottom-width: 0.2mm; }
  .pc-mark.tr { right: -4.5mm; top: -4.5mm; border-left-width: 0.2mm; border-bottom-width: 0.2mm; }
  .pc-mark.bl { left: -4.5mm; bottom: -4.5mm; border-right-width: 0.2mm; border-top-width: 0.2mm; }
  .pc-mark.br { right: -4.5mm; bottom: -4.5mm; border-left-width: 0.2mm; border-top-width: 0.2mm; }
  .pc-title { margin: 0; text-align: left; font-size: 10.5pt; font-weight: 800; text-transform: uppercase; color: #404040; line-height: 1.2; }
  .pc-rules { margin: 1mm 0 2.5mm; font-size: 6.8pt; font-weight: 600; line-height: 1.3; }
  .pc-body { flex: 1 1 auto; }
  .pc-sec { margin: 0 0 2.5mm; }
  .pc-sec h2 { margin: 0 0 0.6mm; font-size: 7.5pt; font-weight: 800; color: #404040; }
  table.pc-t { width: 95mm; border-collapse: collapse; table-layout: fixed; }
  .pc-t th, .pc-t td { padding: 0; text-align: center; border: 0.75pt solid #5e6166; }
  .pc-t thead th { background: #f9fafa; color: #404040; font-size: 7pt; font-weight: 800; height: 4.6mm; }
  .pc-t th.pc-corner { width: 13mm; font-size: 5.5pt; font-weight: 700; text-align: left; padding-left: 1mm; }
  .pc-t tbody th { background: #f9fafa; color: #404040; font-size: 7pt; font-weight: 800; text-align: left; padding-left: 1mm; }
  .pc-t td { font-size: 9pt; font-weight: 900; color: #000; line-height: 1; }
  .pc-t td.m-hit, .pc-t td.m-stand, .pc-t td.m-double { color: #404040; }
  .pc-t td.m-split { color: #1a1d22; }
  .pc-t td.m-surrender { color: #fff; }
  .pc-t tbody tr { height: 4.9mm; }
  .pc-panel.pc-roomy .pc-t tbody tr { height: 7.2mm; }
  .pc-panel.pc-roomy .pc-t td { font-size: 11pt; }
  .pc-legend { margin: 1mm 0 0; font-size: 7pt; font-weight: 800; text-align: center; line-height: 1.3; }
  .pc-dealer { margin: 0 0 0.8mm; font-size: 5.5pt; font-weight: 700; color: #333; text-align: right; padding-right: 0; }
  .pc-fold { margin: 0; height: 4mm; line-height: 4mm; font-size: 5.5pt; color: #5e6166; text-align: center; }
}

@media (max-width: 600px) {
  .shell-header h1 { font-size: 18px; }
  .shell-body { padding: 24px 16px 16px; }
  .rule-panel { grid-template-columns: minmax(0, 1fr); }
  .toggle-row:has(.toggle-opt:nth-child(3)) .toggle-opt span { padding: 0 2px; }
  .print-row { flex-direction: column; }
  .print-btn { width: 100%; }
  .chart td { font-size: 11px; letter-spacing: -0.2px; }
  .chart-section.has-more .sub { margin-bottom: 4px; }
  .chart-section.has-more .swipe-hint { display: block; }
  .chart-section.has-more .scroll-wrap::after {
    content: ""; position: absolute; top: 1px; bottom: 1px; right: 1px; width: 20px; pointer-events: none; z-index: 4;
    border-radius: 0 11px 11px 0; background: linear-gradient(to right, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.95));
  }
  .sa-hand { font-size: 34px; }
  .sa-body { padding: 16px; }
}
</style>

      throw new RangeError('reasonFor: unknown move ' + JSON.stringify(cell.move) + ' (allowed: ' + MOVES.join(', ') + ')');
    }

    const r = ROWS[table][row];
    const text = getStrategyExplanation({
      move: cell.move,
      total: r.total,
      soft: r.soft,
      pair: r.pair,
      dealerRank: dealer,
    });
    if (typeof text !== 'string' || text.length === 0) {
      throw new Error('reasonFor: vendor returned no reason for ' + table + ' ' + row + ' vs ' + dealer + ' ' + cell.move);
    }
    return text;
  }

  return { reasonFor: reasonFor };
});
</script>
<script data-app="chipy-cheat-sheet">
(function (root) {
  'use strict';

  var DEFAULT_RULES = { decks: '4-8', soft17: 'hits', das: 'yes', surrender: 'any' };

  // Display only: engine move name -> word, CSS class suffix. Moves themselves come from chart.js.
  var MOVE_UI = {
    HIT: { word: 'Hit', id: 'hit' },
    STAND: { word: 'Stand', id: 'stand' },
    DOUBLE: { word: 'Double', id: 'double' },
    SPLIT: { word: 'Split', id: 'split' },
    SURRENDER: { word: 'Surrender', id: 'surrender' }
  };
  var MOVE_ORDER = ['HIT', 'STAND', 'DOUBLE', 'SPLIT', 'SURRENDER'];
  var TABLES = [
    { key: 'hard', heading: 'Hard hands', sub: 'No Ace, or an Ace that counts as 1.' },
    { key: 'soft', heading: 'Soft hands', sub: 'An Ace that counts as 11, plus one other card.' },
    { key: 'pairs', heading: 'Pairs', sub: 'Two cards of the same value.' }
  ];

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // Engine soft labels 13..20 are shown as A,2 .. A,9 (D-049, display only).
  function displayRowLabel(table, label) {
    if (table === 'soft') {
      var n = parseInt(label, 10);
      if (n >= 13 && n <= 20) return 'A,' + (n - 11);
    }
    return label;
  }

  // Row title as shown in the reason panel: "Hard 18\u201321", "A,7", "8,8" (D-029, D-049).
  function rowTitle(table, label) {
    if (table === 'hard') return 'Hard ' + String(label).replace('-', '\u2013');
    return displayRowLabel(table, label);
  }
  function detailTitle(table, label, dealer) { return rowTitle(table, label) + ' vs dealer ' + dealer; }

  // ctx: { table, row (engine label), dealer, ri, ci, tab } -> the tap target inside the cell (S-10).
  // It sits after the move word so the S-07 cell markup (td, .cell, .mi, .mw) is unchanged.
  function cellHTML(cell, ctx) {
    var ui = MOVE_UI[cell.move];
    if (!ui) throw new Error('unknown move: ' + cell.move);
    var chg = !!ctx.changed;
    return '<td class="m-' + ui.id + '" data-move="' + cell.move + '"><span class="cell">' +
      '<span class="mi mi-' + ui.id + '" aria-hidden="true"></span>' +
      '<span class="mw">' + ui.word + '</span>' +
      '<button type="button" class="cell-hit" data-cell data-table="' + ctx.table + '" data-erow="' + esc(ctx.row) +
      '" data-dealer="' + esc(ctx.dealer) + '" data-ri="' + ctx.ri + '" data-ci="' + ctx.ci + '" tabindex="' + (ctx.tab ? 0 : -1) + (chg ? '" data-changed="1' : '') +
      '" aria-label="' + esc(detailTitle(ctx.table, ctx.row, ctx.dealer) + ': ' + ui.word + (chg ? ', changed for your new rules' : '') + '. Show why') + '"></button>' +
      '</span></td>';
  }

  function tableHTML(def, chart, rv, marks) {
    var rows = chart[def.key];
    var out = '<section class="chart-section" id="chart-' + def.key + '">' +
      '<h2>' + esc(def.heading) + '</h2><p class="sub">' + esc(def.sub) + '</p>' +
      '<p class="swipe-hint" data-swipe-hint>Swipe for dealer 6\u2013A</p><div class="scroll-wrap">' +
      '<div class="scroll" role="region" aria-label="' + esc(def.heading) + ' chart, scrolls sideways">' +
      '<table class="chart" data-table="' + def.key + '"><thead><tr><th class="corner" scope="col">Your hand</th>';
    chart.columns.forEach(function (c) { out += '<th scope="col" data-dealer="' + esc(c) + '">' + esc(c) + '</th>'; });
    out += '</tr></thead><tbody>';
    var pos = (rv && rv[def.key]) || [0, 0];
    rows.forEach(function (r, ri) {
      out += '<tr data-row="' + esc(r.label) + '"><th scope="row">' + esc(displayRowLabel(def.key, r.label)) + '</th>';
      r.cells.forEach(function (c, ci) {
        out += cellHTML(c, { table: def.key, row: r.label, dealer: chart.columns[ci], ri: ri, ci: ci, tab: pos[0] === ri && pos[1] === ci,
          changed: !!(marks && marks[def.key + '|' + r.label + '|' + chart.columns[ci]]) });
      });
      out += '</tr>';
    });
    // One reason panel per table, outside the sideways-scroll box (D-063, D-050).
    return out + '</tbody></table></div></div>' +
      '<div class="reason-slot" id="reason-' + def.key + '" aria-live="polite" hidden></div></section>';
  }

  // rv (optional): roving focus position per table { hard: [ri, ci], ... }; default is the first cell.
  // marks (optional): { 'table|row|dealer': true } for cells to flag as changed (S-20).
  function renderChartHTML(chart, rv, marks) {
    return TABLES.map(function (def) { return tableHTML(def, chart, rv, marks); }).join('');
  }

  function renderLegendHTML() {
    return MOVE_ORDER.map(function (m) {
      var ui = MOVE_UI[m];
      return '<li class="m-' + ui.id + '"><span class="mi mi-' + ui.id + '" aria-hidden="true"></span>' + ui.word + '</li>';
    }).join('');
  }

  // Rules sentence words (D-039). One map; the tests compare the result to snapshot `label` for all 36.
  var LABEL_WORDS = {
    decks: { '1': '1 deck', '2': '2 decks', '4-8': '4\u20138 decks' },
    soft17: { stands: 'Dealer stands on soft 17', hits: 'Dealer hits on soft 17' },
    das: { yes: 'Double after split allowed', no: 'No double after split' },
    surrender: { none: 'No surrender', any: 'Surrender: any dealer card', except_ace: 'Surrender: any dealer card except ace' }
  };
  // Control definitions: field, group label, [value, button text] (D-002, D-045). Double down is not a control.
  var CONTROLS = [
    { field: 'decks', label: 'Decks', options: [['1', '1'], ['2', '2'], ['4-8', '4\u20138']] },
    { field: 'soft17', label: 'Dealer on soft 17', options: [['stands', 'Stands'], ['hits', 'Hits']] },
    { field: 'das', label: 'Double after split', options: [['yes', 'Yes'], ['no', 'No']] },
    { field: 'surrender', label: 'Surrender', options: [['none', 'Not allowed'], ['any', 'Any dealer card'], ['except_ace', 'Except ace']] }
  ];
  var FIELDS = CONTROLS.map(function (c) { return c.field; });
  var SEP = ' \u00b7 ';

  var state = { rules: copyRules(DEFAULT_RULES) };
  var diffState = null; // { from: rules, list: [...], marks: {...} } after a real rules change; null on load / dismiss
  var listeners = [];
  var dom = null; // set by init() only
  var inited = false;

  function copyRules(r) {
    return { decks: r.decks, soft17: r.soft17, das: r.das, surrender: r.surrender };
  }

  function has(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }

  // ---- What your rules change (S-20, D-067): pure diff of two charts by `move` only ----
  function diffCharts(oldRules, newRules) {
    var a = buildChart(oldRules), b = buildChart(newRules), out = [];
    TABLES.forEach(function (def) {
      b[def.key].forEach(function (row, ri) {
        row.cells.forEach(function (cell, ci) {
          var was = a[def.key][ri].cells[ci].move;
          if (was !== cell.move) out.push({ table: def.key, row: row.label, dealer: b.columns[ci], from: was, to: cell.move });
        });
      });
    });
    return out;
  }

  function diffText(n) {
    return n === 0 ? 'No moves changed for your new rules' :
      (n === 1 ? '1 move changed for your new rules' : n + ' moves changed for your new rules');
  }

  function diffMarks(list) {
    var m = {};
    list.forEach(function (d) { m[d.table + '|' + d.row + '|' + d.dealer] = true; });
    return m;
  }

  function getDiff() { return diffState ? diffState.list.map(function (d) { return Object.assign({}, d); }) : null; }

  function renderDiffNote() {
    if (!dom || !dom.diff) return;
    if (!diffState) { dom.diff.innerHTML = ''; dom.diff.hidden = true; return; }
    dom.diff.innerHTML = '<span data-diff-text>' + esc(diffText(diffState.list.length)) + '</span>' +
      '<button type="button" class="diff-dismiss" data-diff-dismiss>Dismiss</button>';
    dom.diff.hidden = false;
  }

  function dismissDiff() {
    if (!diffState) return false;
    diffState = null;
    render();
    renderResult();
    return true;
  }

  function onDiffClick(ev) {
    if (!closestBtn(ev && ev.target, 'button[data-diff-dismiss]')) return;
    dismissDiff();
    var b = dom.root && dom.root.querySelector ? dom.root.querySelector('#mode-switch [aria-pressed="true"]') : null;
    if (b && b.focus) b.focus();
  }

  // ---- Scroll cue (S-20, D-050, D-066): more columns hidden on the right? ----
  function scrollCue(scrollLeft, clientWidth, scrollWidth) { return scrollLeft + clientWidth < scrollWidth - 1; }

  function updateScrollCues() {
    if (!dom || !dom.chart || typeof dom.chart.querySelectorAll !== 'function') return;
    var list = dom.chart.querySelectorAll('.scroll');
    for (var i = 0; list && i < list.length; i++) {
      var box = list[i], sec = box && typeof box.closest === 'function' ? box.closest('.chart-section') : null;
      if (sec && sec.classList) sec.classList.toggle('has-more', scrollCue(box.scrollLeft, box.clientWidth, box.scrollWidth));
    }
  }

  // Returns a clean rules object, or null when anything is missing or unknown (D-023).
  function validRules(r) {
    if (!r || typeof r !== 'object' || Array.isArray(r)) return null;
    var out = {};
    for (var i = 0; i < FIELDS.length; i++) {
      var f = FIELDS[i], v = has(r, f) ? r[f] : undefined;
      if (typeof v !== 'string' || !has(LABEL_WORDS[f], v)) return null;
      out[f] = v;
    }
    return out;
  }

  // ---- My-table link (S-19, D-023, D-054): rules live in the query, silently ----
  function queryEntries(search) {
    try { return Array.from(new URLSearchParams(String(search || ''))); } catch (e) { return []; }
  }

  // Full rules from a query string. Each field alone: missing, empty, unknown or duplicated -> default (D-045).
  function rulesFromQuery(search) {
    var seen = Object.create(null), vals = Object.create(null), out = copyRules(DEFAULT_RULES);
    queryEntries(search).forEach(function (kv) {
      var k = kv[0];
      if (FIELDS.indexOf(k) < 0) return;
      seen[k] = (seen[k] || 0) + 1;
      vals[k] = kv[1];
    });
    FIELDS.forEach(function (f) {
      if (seen[f] === 1 && has(LABEL_WORDS[f], vals[f])) out[f] = vals[f];
    });
    return out;
  }

  // New "?..." string: other params kept as written and in order, the four rule keys rewritten at the end.
  function queryFromRules(rules, existingSearch) {
    var kept = String(existingSearch || '').replace(/^\?/, '').split('&').filter(function (part) {
      if (!part) return false;
      var raw = part.split('=')[0], key = raw;
      try { key = decodeURIComponent(raw.replace(/\+/g, ' ')); } catch (e) { /* keep raw */ }
      return FIELDS.indexOf(key) < 0;
    });
    var next = validRules(rules) || copyRules(DEFAULT_RULES);
    FIELDS.forEach(function (f) { kept.push(f + '=' + encodeURIComponent(next[f])); });
    return '?' + kept.join('&');
  }

  function syncUrl(rules) {
    try {
      if (typeof location === 'undefined' || typeof history === 'undefined' || !history.replaceState) return;
      var search = queryFromRules(rules, location.search);
      if (search === (location.search || '')) return;
      history.replaceState(null, '', search + (location.hash || ''));
    } catch (e) { /* e.g. file:// restrictions: the chart still works */ }
  }

  function rulesSentence(rules) {
    return FIELDS.map(function (f) { return LABEL_WORDS[f][rules[f]]; }).join(SEP);
  }

  // Pure: control values { decks, soft17, das, surrender } -> rules, or null if incomplete/invalid.
  function rulesFromControls(values) { return validRules(values); }

  function controlsHTML() {
    return CONTROLS.map(function (c) {
      var out = '<fieldset class="rule-field" data-field="' + c.field + '"><legend>' + esc(c.label) + '</legend><div class="toggle-row">';
      c.options.forEach(function (o) {
        out += '<label class="toggle-opt"><input type="radio" name="rule-' + c.field + '" value="' + esc(o[0]) + '">' +
          '<span>' + esc(o[1]) + '</span></label>';
      });
      return out + '</div></fieldset>';
    }).join('');
  }

  // ---- Cell reason panel (S-10, D-063): tap a cell -> why that move is right ----
  // Pure: rules + table + engine row label + dealer column -> { title, move, reason, note }, or null for unknown input.
  // `reason` is ChipyEngine.why.reasonFor unchanged (D-028); `note` is the cell's note, separate (D-030).
  function cellDetail(rules, table, engineRow, dealer) {
    if (!validRules(rules) || !has(TABLE_KEYS, table) || typeof engineRow !== 'string') return null;
    var chart = root.ChipyEngine.chart.buildChart(rules);
    var col = chart.columns.indexOf(dealer);
    var rows = chart[table];
    if (col < 0) return null;
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].label === engineRow) {
        var cell = rows[i].cells[col];
        return {
          title: detailTitle(table, engineRow, dealer),
          table: table, row: engineRow, dealer: dealer,
          move: cell.move,
          reason: root.ChipyEngine.why.reasonFor({ table: table, row: engineRow, dealer: dealer, cell: cell }),
          note: cell.note === undefined ? null : cell.note

      }

  }

  function detailHTML(d, table) {
    var ui = MOVE_UI[d.move];
    if (!ui) throw new Error('unknown move: ' + d.move);
    return '<div class="rp-card" data-reason-card>' +
      '<div class="rp-head"><p class="rp-title" data-title>' + esc(d.title) + '</p>' +
      '<button type="button" class="rp-close" data-close data-table="' + table + '" aria-label="Close reason">Close</button></div>' +
      '<div class="rp-body"><div class="rp-move" data-move="' + d.move + '"><span class="rp-circle"><span class="mi mi-' + ui.id +
      '" aria-hidden="true"></span></span><span class="rp-word">' + ui.word + '</span></div>' +
      '<p class="rp-reason" data-reason>' + esc(d.reason) + '</p>' +

      '</div></div>';
  }

  // Pure: arrow-key move inside one table; stops at the edges (no wrap). Home/End = first/last column.
  function navCell(nRows, nCols, ri, ci, key) {
    if (key === 'ArrowRight') ci = Math.min(nCols - 1, ci + 1);
    else if (key === 'ArrowLeft') ci = Math.max(0, ci - 1);
    else if (key === 'ArrowDown') ri = Math.min(nRows - 1, ri + 1);
    else if (key === 'ArrowUp') ri = Math.max(0, ri - 1);
    else if (key === 'Home') ci = 0;
    else if (key === 'End') ci = nCols - 1;
    else return null;
    return [ri, ci];
  }

  var TABLE_KEYS = { hard: 1, soft: 1, pairs: 1 };
  var rove = { hard: [0, 0], soft: [0, 0], pairs: [0, 0] }; // the one tabbable cell per table
  var openAt = { hard: null, soft: null, pairs: null };     // open reason cell per table: [ri, ci]
  var lastChart = null;

  function cellButtons() {
    var list = dom && dom.chart && dom.chart.querySelectorAll ? dom.chart.querySelectorAll('button[data-cell]') : [];
    var out = [];
    for (var i = 0; list && i < list.length; i++) if (list[i] && typeof list[i].getAttribute === 'function') out.push(list[i]);
    return out;
  }

  function findCell(table, ri, ci) {
    var all = cellButtons();
    for (var i = 0; i < all.length; i++) {
      if (all[i].getAttribute('data-table') === table && all[i].getAttribute('data-ri') === String(ri) &&
        all[i].getAttribute('data-ci') === String(ci)) return all[i];
    }
    return null;
  }

  // Roving tabindex + "open" mark, applied to the live buttons.
  function syncCells() {
    cellButtons().forEach(function (b) {
      var t = b.getAttribute('data-table'), ri = Number(b.getAttribute('data-ri')), ci = Number(b.getAttribute('data-ci'));
      if (!has(rove, t)) return;
      b.setAttribute('tabindex', rove[t][0] === ri && rove[t][1] === ci ? '0' : '-1');
      if (b.classList) b.classList.toggle('is-open', !!openAt[t] && openAt[t][0] === ri && openAt[t][1] === ci);
    });
  }

  function refreshPanels() {
    if (!dom || !lastChart) return;
    TABLES.forEach(function (def) {
      var el = document.getElementById('reason-' + def.key);
      if (!el) return;
      var at = openAt[def.key], d = null;
      if (at && lastChart[def.key][at[0]]) d = cellDetail(state.rules, def.key, lastChart[def.key][at[0]].label, lastChart.columns[at[1]]);
      if (!d) openAt[def.key] = null;
      el.innerHTML = d ? detailHTML(d, def.key) : '';
      el.hidden = !d;
    });
    syncCells();
  }

  function setRove(table, ri, ci) { rove[table] = [ri, ci]; syncCells(); }
  function focusCell(table, ri, ci) { var b = findCell(table, ri, ci); if (b && b.focus) b.focus(); }

  // Returns true when opened. Opening another cell replaces the table's panel content.
  function openReason(table, ri, ci) {
    if (!has(TABLE_KEYS, table) || !lastChart || !lastChart[table][ri] || ci < 0 || ci >= lastChart.columns.length) return false;
    openAt[table] = [ri, ci];
    rove[table] = [ri, ci];
    refreshPanels();
    var cb = findCell(table, ri, ci);
    if (cb && typeof cb.scrollIntoView === 'function') cb.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    var el = document.getElementById('reason-' + table);
    if (el && typeof el.scrollIntoView === 'function') {
      var calm = typeof root.matchMedia === 'function' && root.matchMedia('(prefers-reduced-motion: reduce)').matches;
      el.scrollIntoView({ block: 'nearest', behavior: calm ? 'auto' : 'smooth' });
    }
    return true;
  }

  function closeReason(table, refocus) {
    if (!has(TABLE_KEYS, table) || !openAt[table]) return false;
    var at = openAt[table];
    openAt[table] = null;
    rove[table] = [at[0], at[1]];
    refreshPanels();
    if (refocus) focusCell(table, at[0], at[1]);
    return true;
  }

  function getOpenReason() {
    var out = {};
    TABLES.forEach(function (d) { out[d.key] = openAt[d.key] ? [openAt[d.key][0], openAt[d.key][1]] : null; });
    return out;
  }

  function closestBtn(t, sel) { return t && typeof t.closest === 'function' ? t.closest(sel) : null; }
  function num(b, k) { return Number(b.getAttribute(k)); }

  function onChartClick(ev) {
    var t = ev && ev.target;
    var c = closestBtn(t, 'button[data-cell]');
    if (c) { openReason(c.getAttribute('data-table'), num(c, 'data-ri'), num(c, 'data-ci')); return; }
    var x = closestBtn(t, 'button[data-close]');
    if (x) closeReason(x.getAttribute('data-table'), true);
  }

  function onChartKey(ev) {
    var t = ev && ev.target, key = ev && ev.key;
    var c = closestBtn(t, 'button[data-cell]');
    var x = c ? null : closestBtn(t, 'button[data-close]');
    var stop = function () { if (ev.preventDefault) ev.preventDefault(); };
    if (key === 'Escape') {
      var tb = c || x;
      if (tb && closeReason(tb.getAttribute('data-table'), true)) stop();
      return;
    }
    if (!c || !lastChart) return;
    var table = c.getAttribute('data-table'), ri = num(c, 'data-ri'), ci = num(c, 'data-ci');
    if (key === 'Enter' || key === ' ' || key === 'Spacebar') { stop(); openReason(table, ri, ci); return; }
    var next = navCell(lastChart[table].length, lastChart.columns.length, ri, ci, key);
    if (!next) return;
    stop();
    setRove(table, next[0], next[1]);
    focusCell(table, next[0], next[1]);
  }

  function render() {
    if (!dom) return;
    var rules = state.rules;
    var act = typeof document !== 'undefined' ? document.activeElement : null;
    var hadFocus = !!(act && typeof act.getAttribute === 'function' && act.getAttribute('data-cell') !== null);
    var focusAt = hadFocus ? [act.getAttribute('data-table'), num(act, 'data-ri'), num(act, 'data-ci')] : null;
    lastChart = root.ChipyEngine.chart.buildChart(rules);
    dom.chart.innerHTML = renderChartHTML(lastChart, rove, diffState && diffState.marks);
    refreshPanels();
    if (focusAt) focusCell(focusAt[0], focusAt[1], focusAt[2]);
    renderPrint();
    renderDiffNote();
    updateScrollCues();
    dom.text.textContent = rulesSentence(rules);
    var radios = dom.panel.querySelectorAll('input[type="radio"]');
    for (var i = 0; i < radios.length; i++) {
      var f = radios[i].name.replace(/^rule-/, '');
      radios[i].checked = rules[f] === radios[i].value;
    }
  }

  // Returns true when applied. Invalid input changes nothing and fires nothing.
  function setRules(rules) {
    var next = validRules(rules);
    if (!next) return false;
    var changed = FIELDS.some(function (f) { return state.rules[f] !== next[f]; });
    if (changed) {
      var list = diffCharts(state.rules, next);
      diffState = { from: copyRules(state.rules), list: list, marks: diffMarks(list) };
    }
    state.rules = next;
    render();
    if (!changed) return true;
    var snapshot = copyRules(next);
    listeners.slice().forEach(function (fn) { fn(copyRules(snapshot)); });
    return true;
  }

  function getRules() { return copyRules(state.rules); }

  // Fires once per valid setRules call with the new rules. Returns an unsubscribe function.
  function onRulesChange(fn) {
    if (typeof fn !== 'function') throw new Error('onRulesChange needs a function');
    listeners.push(fn);
    return function () { var i = listeners.indexOf(fn); if (i >= 0) listeners.splice(i, 1); };
  }

  function onControlChange(ev) {
    var t = ev && ev.target;
    if (!t || t.type !== 'radio' || typeof t.name !== 'string') return;
    var f = t.name.replace(/^rule-/, '');
    if (FIELDS.indexOf(f) < 0) return;
    var values = copyRules(state.rules);
    values[f] = t.value;
    if (!setRules(rulesFromControls(values))) render(); // put the controls back on the active rules
  }

  // ---- Table mode (S-18, D-055, D-061): two taps -> the chart's own cell ----
  var CALC_HREF = '/tools/blackjack-hand-strategy-calculator';
  var CALC_TEXT = "See every move's value in the Hand Strategy Calculator";
  var DEALER_CARDS = ['2', '3', '4', '5', '6', '7', '8', '9', '10', 'A'];
  var HAND_OPTIONS = [];
  (function () {
    var n, c;
    for (n = 5; n <= 21; n++) {
      HAND_OPTIONS.push({ key: 'hard:' + n, table: 'hard', text: String(n), label: 'Hard ' + n,
        row: n <= 7 ? '5-7' : (n >= 18 ? '18-21' : String(n)) });
    }
    for (n = 2; n <= 9; n++) {
      HAND_OPTIONS.push({ key: 'soft:A,' + n, table: 'soft', text: 'A,' + n, label: 'A,' + n, row: String(n + 11) });
    }
    ['2', '3', '4', '5', '6', '7', '8', '9', '10', 'A'].forEach(function (r) {
      c = r + ',' + r;
      HAND_OPTIONS.push({ key: 'pairs:' + c, table: 'pairs', text: c, label: c, row: c });
    });
  })();
  var HAND_GROUPS = [
    { table: 'hard', heading: 'Hard totals' },
    { table: 'soft', heading: 'Soft hands (Ace + card)' },
    { table: 'pairs', heading: 'Pairs' }
  ];

  function handOption(key) {
    for (var i = 0; i < HAND_OPTIONS.length; i++) if (HAND_OPTIONS[i].key === key) return HAND_OPTIONS[i];
    return null;
  }

  // Pure: rules + hand option key + dealer card -> the chart cell, or null for unknown input.
  function tableAnswer(rules, hand, dealer) {
    var opt = typeof hand === 'string' ? handOption(hand) : null;
    if (!opt || DEALER_CARDS.indexOf(dealer) < 0 || !validRules(rules)) return null;
    var chart = root.ChipyEngine.chart.buildChart(rules);
    var col = chart.columns.indexOf(dealer);
    var rows = chart[opt.table];
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].label === opt.row && col >= 0) {
        var cell = rows[i].cells[col];
        return { move: cell.move, note: cell.note === undefined ? null : cell.note, rowLabel: opt.row,
          table: opt.table, handLabel: opt.label, dealer: dealer };
      }
    }
    return null;
  }

  function resultHTML(ans, changed) {
    if (!ans) return '<p class="sa-empty">Pick your hand, then the dealer’s card.</p>';
    var ui = MOVE_UI[ans.move];
    if (!ui) throw new Error('unknown move: ' + ans.move);
    return '<div class="sa-card" data-result="1"><div class="sa-header">Recommended Play</div><div class="sa-body">' +
      (changed ? '<p class="sa-changed" data-changed>Changed for your new rules</p>' : '') +
      '<p class="sa-hand" data-hand>' + esc(ans.handLabel) + '</p>' +
      '<p class="sa-dealer" data-dealer-shown>Dealer shows ' + esc(ans.dealer) + '</p>' +
      '<div class="sa-rec-move" data-move="' + ans.move + '"><span class="sa-circle"><span class="mi mi-' + ui.id +
      '" aria-hidden="true"></span></span><span class="sa-rec-word">' + ui.word + '</span></div>' +
      (ans.note === null ? '' : '<p class="sa-rec-note" data-note>' + esc(ans.note) + '</p>') +
      '<p class="sa-link-row"><a class="sa-link" href="' + CALC_HREF + '">' + esc(CALC_TEXT) + '</a></p>' +
      '</div></div>';
  }

  var tm = { mode: 'full', hand: null, dealer: null, rulesOpen: false };

  function pickHTML() {
    var out = '<section class="tm-step"><h2>1. Your hand</h2>';
    HAND_GROUPS.forEach(function (g) {
      out += '<div class="tm-group"><h3>' + esc(g.heading) + '</h3><div class="pick-grid">';
      HAND_OPTIONS.forEach(function (o) {
        if (o.table !== g.table) return;
        out += '<button type="button" class="pick" data-act="hand" data-val="' + esc(o.key) + '" aria-label="' + esc(o.label) +
          '" aria-pressed="' + (tm.hand === o.key) + '">' + esc(o.text) + '</button>';
      });
      out += '</div></div>';
    });
    out += '</section>';
    if (tm.hand) {
      out += '<section class="tm-step" id="tm-dealer"><h2>2. Dealer shows</h2><div class="pick-grid">';
      DEALER_CARDS.forEach(function (d) {
        out += '<button type="button" class="pick" data-act="dealer" data-val="' + d + '" aria-label="Dealer shows ' + d +
          '" aria-pressed="' + (tm.dealer === d) + '">' + d + '</button>';
      });
      out += '</div></section>';
    }
    return out;
  }

  function modeHTML() {
    return [['full', 'Full chart'], ['table', 'Table mode']].map(function (m) {
      return '<button type="button" class="mode-btn" data-act="mode" data-val="' + m[0] + '" aria-pressed="' +
        (tm.mode === m[0]) + '">' + m[1] + '</button>';
    }).join('');
  }

  function renderResult() {
    if (!dom) return;
    var ans = tm.hand && tm.dealer ? tableAnswer(state.rules, tm.hand, tm.dealer) : null;
    var chg = !!(ans && diffState && diffState.marks[ans.table + '|' + ans.rowLabel + '|' + ans.dealer]);
    dom.tresult.innerHTML = resultHTML(ans, chg);
  }

  function renderTable(focusSel) {
    if (!dom) return;
    dom.modeSwitch.innerHTML = modeHTML();
    dom.full.hidden = tm.mode !== 'full';
    dom.table.hidden = tm.mode !== 'table';
    // Rule panel stays in the DOM; in Table mode it is collapsed behind "Change rules" (D-062).
    var collapsed = tm.mode === 'table' && !tm.rulesOpen;
    dom.panel.hidden = collapsed;
    dom.toggle.hidden = tm.mode !== 'table';
    if (dom.toggle.setAttribute) dom.toggle.setAttribute('aria-expanded', String(tm.mode === 'table' && tm.rulesOpen));
    else dom.toggle.ariaExpanded = String(tm.mode === 'table' && tm.rulesOpen);
    dom.toggle.textContent = tm.rulesOpen ? 'Hide rules' : 'Change rules';
    dom.tpick.innerHTML = tm.mode === 'table' ? pickHTML() : '';
    renderResult();
    updateScrollCues();
    if (focusSel && dom.root && dom.root.querySelector) {
      var el = dom.root.querySelector(focusSel);
      if (el && el.focus) el.focus();
    }
  }

  function scrollTo(id) {
    if (typeof document === 'undefined' || !document.getElementById) return;
    var el = document.getElementById(id);
    if (!el || typeof el.scrollIntoView !== 'function') return;
    var calm = typeof root.matchMedia === 'function' && root.matchMedia('(prefers-reduced-motion: reduce)').matches;
    el.scrollIntoView({ block: 'start', behavior: calm ? 'auto' : 'smooth' });
  }

  function toggleRules() {
    tm.rulesOpen = !tm.rulesOpen;
    renderTable('#rules-toggle');
    return tm.rulesOpen;
  }

  function setMode(m) {
    if (m !== 'full' && m !== 'table') return false;
    tm.mode = m;
    renderTable('#mode-switch [data-val="' + m + '"]');
    return true;
  }
  function selectHand(key) {
    if (!handOption(key)) return false;
    tm.hand = key;
    renderTable('#table-pick [data-act="hand"][data-val="' + key + '"]');
    scrollTo('tm-dealer');
    return true;
  }
  function selectDealer(d) {
    if (DEALER_CARDS.indexOf(d) < 0 || !tm.hand) return false;
    tm.dealer = d;
    renderTable('#table-pick [data-act="dealer"][data-val="' + d + '"]');
    scrollTo('table-result');
    return true;
  }
  function getSelection() { return { mode: tm.mode, hand: tm.hand, dealer: tm.dealer, rulesOpen: tm.rulesOpen }; }

  function onTableClick(ev) {
    var t = ev && ev.target;
    if (!t) return;
    var b = t.closest ? t.closest('button[data-act]') : t;
    if (!b || !b.getAttribute) return;
    var act = b.getAttribute('data-act'), val = b.getAttribute('data-val');
    if (act === 'mode') setMode(val);
    else if (act === 'hand') selectHand(val);
    else if (act === 'dealer') selectDealer(val);
  }

  // ---- Print (S-11, D-054, D-064): markup built from buildChart(rules); same moves as the screen chart ----
  var POCKET_LETTER = { HIT: 'H', STAND: 'S', DOUBLE: 'D', SPLIT: 'P', SURRENDER: 'R' };

  function pocketLegendText() {
    return MOVE_ORDER.map(function (m) { return POCKET_LETTER[m] + ' ' + MOVE_UI[m].word; }).join(SEP);
  }

  // Full page: title, rules sentence, legend (icon + word), three tables with word + icon per cell.
  function renderPrintFullHTML(rules) {
    var r = validRules(rules) || copyRules(DEFAULT_RULES);
    var chart = buildChart(r);
    var out = '<div class="pf-page"><h1 class="pf-title" data-title>Blackjack Cheat Sheet</h1>' +
      '<p class="pf-rules" data-rules>' + esc(rulesSentence(r)) + '</p>' +
      '<ul class="pf-legend" data-legend>' + renderLegendHTML() + '</ul>';
    TABLES.forEach(function (def) {
      out += '<section class="pf-sec" data-table="' + def.key + '"><h2>' + esc(def.heading) + '</h2>' +
        '<table class="pf"><thead><tr><th class="pf-corner" scope="col">Your hand</th>';
      chart.columns.forEach(function (c) { out += '<th scope="col">' + esc(c) + '</th>'; });
      out += '</tr></thead><tbody>';
      chart[def.key].forEach(function (row) {
        out += '<tr data-row="' + esc(row.label) + '"><th scope="row">' + esc(displayRowLabel(def.key, row.label)) + '</th>';
        row.cells.forEach(function (cell) {
          var ui = MOVE_UI[cell.move];
          if (!ui) throw new Error('unknown move: ' + cell.move);
          out += '<td class="m-' + ui.id + '" data-move="' + cell.move + '"><span class="pc"><span class="mi mi-' + ui.id +
            '" aria-hidden="true"></span><span class="mw">' + ui.word + '</span></span></td>';
        });
        out += '</tr>';
      });
      out += '</tbody></table></section>';
    });
    return out + '</div>';
  }

  function pocketTableHTML(def, chart, heading) {
    var out = '<section class="pc-sec" data-table="' + def.key + '"><h2>' + esc(heading) + '</h2>' +
      '<table class="pc-t"><thead><tr><th class="pc-corner" scope="col">Dealer:</th>';
    chart.columns.forEach(function (c) { out += '<th scope="col">' + esc(c) + '</th>'; });
    out += '</tr></thead><tbody>';
    chart[def.key].forEach(function (row) {
      out += '<tr data-row="' + esc(row.label) + '"><th scope="row">' + esc(displayRowLabel(def.key, row.label)) + '</th>';
      row.cells.forEach(function (cell) {
        var ui = MOVE_UI[cell.move], letter = POCKET_LETTER[cell.move];
        if (!ui || !letter) throw new Error('unknown move: ' + cell.move);
        out += '<td class="m-' + ui.id + '" data-move="' + cell.move + '">' + letter + '</td>';
      });
      out += '</tr>';
    });
    return out + '</tbody></table></section>';
  }

  // Pocket card: panel 1 = Hard, panel 2 = Soft + Pairs; one bold letter per cell; two 105x148 mm panels.
  function renderPocketHTML(rules) {
    var r = validRules(rules) || copyRules(DEFAULT_RULES);
    var chart = buildChart(r);
    function panel(n, cls, body) {
      return '<div class="pc-panel ' + cls + '" data-panel="' + n + '"><p class="pc-title">Blackjack Cheat Sheet</p>' +
        '<p class="pc-rules" data-rules>' + esc(rulesSentence(r)) + '</p><div class="pc-body">' + body + '</div>' +
        '<p class="pc-legend" data-legend>' + esc(pocketLegendText()) + '</p></div>';
    }
    var hard = TABLES[0], soft = TABLES[1], pairs = TABLES[2];
    return '<div class="pc-sheet"><span class="pc-mark tl"></span><span class="pc-mark tr"></span>' +
      '<span class="pc-mark bl"></span><span class="pc-mark br"></span>' +
      panel(1, 'pc-roomy', pocketTableHTML(hard, chart, 'Hard hands')) +
      panel(2, '', pocketTableHTML(soft, chart, 'Soft hands (Ace + card)') + pocketTableHTML(pairs, chart, 'Pairs')) +
      '</div><p class="pc-fold">Fold or cut along the dashed line. Landscape paper (A4 or Letter).</p>';
  }

  // Rebuilt from the live rules; called on every render() and again right before printing.
  function renderPrint() {
    if (!dom) return;
    if (dom.printFull) dom.printFull.innerHTML = renderPrintFullHTML(state.rules);
    if (dom.printPocket) dom.printPocket.innerHTML = renderPocketHTML(state.rules);
  }

  function setPrintFlag(mode) {
    var de = typeof document !== 'undefined' ? document.documentElement : null;
    if (!de) return;
    if (mode) { if (de.dataset) de.dataset.print = mode; else de.setAttribute('data-print', mode); }
    else if (de.dataset) delete de.dataset.print;
    else if (de.removeAttribute) de.removeAttribute('data-print');
  }

  // mode: 'full' | 'pocket'. Sets the flag, refreshes the markup, prints, clears the flag on afterprint.
  function printSheet(mode) {
    if (mode !== 'full' && mode !== 'pocket') return false;
    renderPrint();
    setPrintFlag(mode);
    if (typeof root.print !== 'function') { setPrintFlag(null); return false; }
    root.print();
    return true;
  }

  function init() {
    if (inited) return;
    inited = true;
    dom = {
      panel: document.getElementById('rule-panel'),
      text: document.getElementById('rules-text'),
      chart: document.getElementById('chart'),
      root: typeof document !== 'undefined' ? document : null,
      modeSwitch: document.getElementById('mode-switch'),
      toggle: document.getElementById('rules-toggle'),
      full: document.getElementById('full-view'),
      table: document.getElementById('table-mode'),
      tpick: document.getElementById('table-pick'),
      tresult: document.getElementById('table-result'),
      diff: document.getElementById('diff-note'),
      printFull: document.getElementById('print-full'),
      printPocket: document.getElementById('print-pocket')
    };
    try { if (typeof location !== 'undefined') state.rules = rulesFromQuery(location.search); } catch (e) { /* defaults */ }
    document.getElementById('legend').innerHTML = renderLegendHTML();
    dom.panel.innerHTML = controlsHTML();
    dom.panel.addEventListener('change', onControlChange);
    dom.chart.addEventListener('click', onChartClick);
    dom.chart.addEventListener('keydown', onChartKey);
    dom.chart.addEventListener('scroll', updateScrollCues, true);
    if (dom.diff && dom.diff.addEventListener) dom.diff.addEventListener('click', onDiffClick);
    render();
    dom.modeSwitch.addEventListener('click', onTableClick);
    dom.tpick.addEventListener('click', onTableClick);
    dom.toggle.addEventListener('click', toggleRules);
    onRulesChange(renderResult);
    onRulesChange(syncUrl);
    renderTable();
    var bf = document.getElementById('print-full-btn'), bp = document.getElementById('print-pocket-btn');
    if (bf && bf.addEventListener) bf.addEventListener('click', function () { printSheet('full'); });
    if (bp && bp.addEventListener) bp.addEventListener('click', function () { printSheet('pocket'); });
    if (typeof root.addEventListener === 'function') {
      root.addEventListener('beforeprint', renderPrint);
      root.addEventListener('resize', updateScrollCues);
      root.addEventListener('afterprint', function () { setPrintFlag(null); });
    }
  }

  function buildChart(rules) { return root.ChipyEngine.chart.buildChart(rules); }

  root.ChipyCheatSheet = {
    DEFAULT_RULES: DEFAULT_RULES,
    buildChart: buildChart,
    displayRowLabel: displayRowLabel,
    renderChartHTML: renderChartHTML,
    renderLegendHTML: renderLegendHTML,
    rulesSentence: rulesSentence,
    rulesFromControls: rulesFromControls,
    rulesFromQuery: rulesFromQuery,
    diffCharts: diffCharts,
    diffText: diffText,
    getDiff: getDiff,
    dismissDiff: dismissDiff,
    scrollCue: scrollCue,
    updateScrollCues: updateScrollCues,
    queryFromRules: queryFromRules,
    getRules: getRules,
    setRules: setRules,
    onRulesChange: onRulesChange,
    HAND_OPTIONS: HAND_OPTIONS,
    DEALER_CARDS: DEALER_CARDS,
    tableAnswer: tableAnswer,
    renderResultHTML: resultHTML,
    cellDetail: cellDetail,
    navCell: navCell,
    openReason: openReason,
    closeReason: closeReason,
    getOpenReason: getOpenReason,
    setMode: setMode,
    selectHand: selectHand,
    selectDealer: selectDealer,
    getSelection: getSelection,
    toggleRules: toggleRules,
    POCKET_LETTER: POCKET_LETTER,
    renderPrintFullHTML: renderPrintFullHTML,
    renderPocketHTML: renderPocketHTML,
    printSheet: printSheet,
    init: init
  };

  if (typeof document !== 'undefined') init();
})(typeof window !== 'undefined' ? window : globalThis);
</script>
</body>
</html>
